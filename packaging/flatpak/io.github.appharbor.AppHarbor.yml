app-id: io.github.appharbor.AppHarbor
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: appharbor

finish-args:
  # Display & Wayland
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

  # Filesystem access for multi-format discovery & uninstallation
  - --filesystem=host
  - --filesystem=home

  # D-Bus permissions
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.Notifications
  - --system-talk-name=org.freedesktop.PackageKit
  - --system-talk-name=org.freedesktop.PolicyKit1

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man

modules:
  - name: appharbor
    buildsystem: simple
    build-commands:
      - pip3 install --no-build-isolation --no-deps --prefix=/app .
      - install -Dm644 data/io.github.appharbor.AppHarbor.desktop /app/share/applications/io.github.appharbor.AppHarbor.desktop
      - install -Dm644 data/io.github.appharbor.AppHarbor.metainfo.xml /app/share/metainfo/io.github.appharbor.AppHarbor.metainfo.xml
      - install -Dm644 data/icons/io.github.appharbor.AppHarbor.svg /app/share/icons/hicolor/scalable/apps/io.github.appharbor.AppHarbor.svg
    sources:
      - type: dir
        path: ../..
