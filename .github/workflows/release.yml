name: Release & Multi-Distro Packages

on:
  push:
    tags:
      - "v*.*.*"
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    name: Build Debian Package (.deb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Debian Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper dh-python python3-all python3-setuptools dpkg-dev

      - name: Build Debian Package
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          VERSION="${TAG_VER:-0.1.0}"
          cp -r packaging/debian debian
          mkdir -p debian
          cat << EOF > debian/changelog
          appharbor (${VERSION}-1) unstable; urgency=medium

            * Automated release build for ${VERSION}

           -- AppHarbor Team <support@appharbor.org>  $(date -R)
          EOF
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          find .. -maxdepth 1 -name "appharbor*.deb" -exec mv {} dist/ \;

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: dist/*.deb

  build-rpm:
    name: Build RPM Package (.rpm)
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install RPM Build Tools
        run: |
          dnf install -y rpm-build python3-devel python3-setuptools tar gzip

      - name: Build RPM Package
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          VERSION="${TAG_VER:-0.1.0}"
          mkdir -p ~/rpmbuild/SOURCES ~/rpmbuild/SPECS dist
          tar --exclude-vcs --transform "s,^\.,appharbor-${VERSION}," -czf ~/rpmbuild/SOURCES/appharbor-${VERSION}.tar.gz .
          rpmbuild -ba packaging/appharbor.spec \
            --define "version ${VERSION}" \
            --define "_sourcedir $HOME/rpmbuild/SOURCES" \
            --define "_specdir packaging"
          find ~/rpmbuild/RPMS -name "*.rpm" -exec cp {} dist/ \;

      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: dist/*.rpm

  build-tarball:
    name: Build Source Tarball & Wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Source Tarball & Wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Upload Distribution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-tarball
          path: dist/*

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-deb, build-rpm, build-tarball]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          echo "=== Computed Checksums ==="
          cat SHA256SUMS.txt

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.deb
            release-artifacts/*.rpm
            release-artifacts/*.tar.gz
            release-artifacts/*.whl
            release-artifacts/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
