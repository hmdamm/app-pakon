name: Release & Multi-Distro Packages

on:
  push:
    tags:
      - "v*.*.*"
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    name: Build Debian Package (.deb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Debian Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Build Debian Package
        run: |
          ./packaging/debian/build-deb.sh

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: dist/*.deb

  build-rpm:
    name: Build RPM Package (.rpm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install RPM Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm tar gzip

      - name: Build RPM Package
        run: |
          ./packaging/rpm/build-rpm.sh

      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: dist/*.rpm

  build-appimage:
    name: Build Standalone AppImage (.AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install AppImage Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y curl desktop-file-utils

      - name: Build AppImage
        run: |
          ./packaging/appimage/build-appimage.sh

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage-package
          path: dist/*.AppImage

  build-tarball:
    name: Build Source Tarball & Wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Source Tarball & Wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload Distribution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-tarball
          path: dist/*

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-deb, build-rpm, build-appimage, build-tarball]
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          echo "=== Computed Checksums ==="
          cat SHA256SUMS.txt

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.deb
            release-artifacts/*.rpm
            release-artifacts/*.AppImage
            release-artifacts/*.tar.gz
            release-artifacts/*.whl
            release-artifacts/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
