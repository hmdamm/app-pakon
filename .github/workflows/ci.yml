name: CI & Packaging Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit & Safety Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libcairo2-dev \
            libgirepository1.0-dev \
            python3-gi \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            desktop-file-utils \
            appstream \
            appstream-util \
            xvfb \
            dpkg-dev

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pycairo PyGObject pytest
          python -m pip install -e .

      - name: Run Test Suite under Xvfb
        run: |
          xvfb-run -a pytest -v

      - name: Validate Desktop Entry File
        run: |
          desktop-file-validate data/io.github.appharbor.AppHarbor.desktop

      - name: Validate AppStream Metadata
        run: |
          appstream-util validate-relax data/io.github.appharbor.AppHarbor.metainfo.xml

  build-artifacts:
    name: Build & Validate Distribution Packages
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Packaging System Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm dpkg-dev curl desktop-file-utils

      - name: Build Source Distribution & Wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Test Build Debian Package (.deb)
        run: |
          ./packaging/debian/build-deb.sh

      - name: Test Build RPM Package (.rpm)
        run: |
          ./packaging/rpm/build-rpm.sh

      - name: Test Build AppImage
        run: |
          ./packaging/appimage/build-appimage.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-packages-ci
          path: dist/
