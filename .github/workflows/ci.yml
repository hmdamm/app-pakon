name: CI & Packaging Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit & Safety Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev gir1.2-gtk-4.0 gir1.2-adw-1 desktop-file-utils appstream-util

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install wheel setuptools pytest

      - name: Run Test Suite
        run: |
          pytest -v

      - name: Validate Desktop Entry File
        run: |
          desktop-file-validate data/io.github.appharbor.AppHarbor.desktop

      - name: Validate AppStream Metadata
        run: |
          appstream-util validate-relax data/io.github.appharbor.AppHarbor.metainfo.xml

  build-artifacts:
    name: Build Distribution Artifacts
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Wheel & Source Dist
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist-packages
          path: dist/
