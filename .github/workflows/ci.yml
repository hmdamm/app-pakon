name: CI & Packaging Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit & Safety Tests (Ubuntu System Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            python3-pytest \
            desktop-file-utils \
            appstream-util \
            xvfb

      - name: Run Test Suite under Xvfb
        run: |
          xvfb-run -a python3 -m pytest -v

      - name: Validate Desktop Entry File
        run: |
          desktop-file-validate data/io.github.appharbor.AppHarbor.desktop

      - name: Validate AppStream Metadata
        run: |
          appstream-util validate-relax data/io.github.appharbor.AppHarbor.metainfo.xml

  build-artifacts:
    name: Build & Validate Distribution Packages
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Packaging System Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            python3-pip \
            python3-build \
            rpm \
            dpkg-dev \
            curl \
            desktop-file-utils \
            || true

      - name: Build Source Distribution & Wheel
        run: |
          python3 -m build || python3 -m pip install --break-system-packages build && python3 -m build

      - name: Test Build Debian Package (.deb)
        run: |
          ./packaging/debian/build-deb.sh

      - name: Test Build RPM Package (.rpm)
        run: |
          ./packaging/rpm/build-rpm.sh

      - name: Test Build AppImage
        run: |
          ./packaging/appimage/build-appimage.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-packages-ci
          path: dist/
